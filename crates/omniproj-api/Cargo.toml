[package]
name = "omniproj-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OmniProj internal: local read-only dashboard (axum + embedded SPA)."
publish = false

[dependencies]
omniproj-core.workspace = true
omniproj-capture.workspace = true
omniproj-daemon.workspace = true
omniproj-ipc.workspace = true
omniproj-index.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# Embeds the committed React build (web/dist) into the binary — cargo-install users
# never need Node. See web/README.md for the build/refresh contract.
rust-embed = "8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
