[package]
name = "omniproj-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OmniProj desktop app (Tauri) — git-grounded project advancer"
default-run = "omniproj-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
omniproj-core = { workspace = true }
omniproj-capture = { workspace = true }
omniproj-distill = { workspace = true }
