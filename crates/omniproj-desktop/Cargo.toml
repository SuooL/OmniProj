[package]
name = "omniproj-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OmniProj desktop app (Tauri) — local-first project re-entry environment"
default-run = "omniproj-desktop"

[lib]
name = "omniproj_desktop"
path = "src/lib.rs"

[[bin]]
name = "omniproj-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
omniproj-core = { workspace = true }
omniproj-capture = { workspace = true }

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
