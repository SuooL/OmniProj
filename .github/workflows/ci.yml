name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  # The frontend (crates/omniproj-api/web) is a committed dist embedded into the binary at
  # build time. This job ensures the frontend still BUILDS. It does not byte-diff dist:
  # Tailwind v4's build output is not deterministic run-to-run, so an exact diff is flaky.
  # A fresh dist is produced by `tauri build` (beforeBuildCommand) at packaging time.
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/omniproj-api/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install deps
        run: npm ci
      - name: Build frontend
        run: npm run build
