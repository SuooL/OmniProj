[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/SuooL/OmniProj"
homepage = "https://github.com/SuooL/OmniProj"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
regex = "1"
dirs = "5"
walkdir = "2"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util", "io-std", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }

# internal crates
omniproj-core = { path = "crates/omniproj-core" }
omniproj-capture = { path = "crates/omniproj-capture" }
omniproj-distill = { path = "crates/omniproj-distill" }
omniproj-index = { path = "crates/omniproj-index" }
